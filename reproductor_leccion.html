        { course: 'braille-basico', lesson: 'escritura-regleta', title: 'Uso de la Regleta y el Punzón', duration: '12:05', level: 'Intermedio', module: 'Módulo 2', background: 'https://lh3.googleusercontent.com/aida-public/AB6AXuDagdBHmrZt6XPYfHdPHsF_EfwPns0gjzYx9BIB9JDgzPSxYdFnKcjpHIjle9jziX1XJC3DE0PS8M6l0PC44KFqyrTxCN0QvEUG4rlPBFmd0nEQsvPWV6BjYZkiI843OddfaF54Xgl68OhjNkqU5mqS0bi6JnqHto9llG19_V50StftWn1Q8WLlX6_6RRGzUiVpRJUmSyXxSYBd37aZTfqDsYoU8bdYiu3sTshA0Zn7X2x50htrCVMr4A' },
        { course: 'historia-braille', lesson: 'historia-digital', title: 'Historia del Braille Digital', duration: '15:40', level: 'Avanzado', module: 'Módulo 5', background: 'https://img.youtube.com/vi/vNDN2YHTS5g/maxresdefault.jpg' }
      ]
    },
    'historia-braille': {
      name: 'Historia del Braille Digital',
      instructor: 'Carlos Mendoza',

          duration: '15:40',
          progress: 0,
          youtube: 'https://youtu.be/vNDN2YHTS5g?si=roWuSJuju1p9O_28',
          background: 'https://img.youtube.com/vi/vNDN2YHTS5g/maxresdefault.jpg'
        }
      },
      related: [
        { course: 'braille-basico', lesson: 'introduccion-alfabeto', title: 'Introducción al Alfabeto Braille', duration: '08:45', level: 'Principiante', module: 'Módulo 1', background: 'https://lh3.googleusercontent.com/aida-public/AB6AXuAByJviF9o43voRr_6aCzC-1zCSODe3wkjRyJxtp7-v_ozp5Vw8IDMKa71XFcmYmqQw8F8yKB3YD589sRDoMuWF99IsgmpP-Ky_DmBUTTdo09WZgRS7G1QEDuQjnc__NqkrfOzeJH6saNJvmZratbrFTiqtFQpIhysgejulN4muBFcCdw7VR_7kzqRngYSd4sL3H_ldU9aym63sn8Q8VQVGTdNPAJLw32SNBvS8YWyZRz2mxhbJ2Z5RTQ' },
        { course: 'braille-basico', lesson: 'escritura-regleta', title: 'Escritura con Regleta y Punzón', duration: '12:20', level: 'Intermedio', module: 'Módulo 2', background: 'https://lh3.googleusercontent.com/aida-public/AB6AXuDagdBHmrZt6XPYfHdPHsF_EfwPns0gjzYx9BIB9JDgzPSxYdFnKcjpHIjle9jziX1XJC3DE0PS8M6l0PC44KFqyrTxCN0QvEUG4rlPBFmd0nEQsvPWV6BjYZkiI843OddfaF54Xgl68OhjNkqU5mqS0bi6JnqHto9llG19_V50StftWn1Q8WLlX6_6RRGzUiVpRJUmSyXxSYBd37aZTfqDsYoU8bdYiu3sTshA0Zn7X2x50htrCVMr4A' }
      ]
    }
  };

  var DEFAULT_COURSE = 'braille-basico';
  var DEFAULT_LESSON = 'introduccion-alfabeto';

  // --- Parse URL params ---
  var params = new URLSearchParams(window.location.search);
  var courseSlug = params.get('course') || DEFAULT_COURSE;
  var lessonSlug = params.get('lesson') || DEFAULT_LESSON;
  var progressOverride = parseInt(params.get('progress'), 10);
  var youtubeUrl = params.get('youtube');

  // --- Lookup data ---
  var course = COURSES[courseSlug] || COURSES[DEFAULT_COURSE];
  var lesson = (course.lessons && course.lessons[lessonSlug]) || course.lessons[DEFAULT_LESSON];

  // --- Determine YouTube URL: prefer lesson data, fall back to query param ---
  var effectiveYoutubeUrl = lesson.youtube || youtubeUrl || null;
  var youtubeId = null;
  if (effectiveYoutubeUrl) {
    var m = effectiveYoutubeUrl.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    youtubeId = m ? m[1] : null;
  }

var playerSection = document.querySelector('.relative.bg-primary.overflow-hidden');
var playerContainer = document.getElementById('player-container');
var resumeOverlay = document.getElementById('resume-overlay');
var resumeBtn = document.getElementById('resume-btn');
var completeBadge = document.getElementById('complete-badge');
var progressSaveIndicator = document.getElementById('progress-save-indicator');

var savedProgressKey = 'bl_video_progress_' + courseSlug + '_' + lessonSlug;
var player = null;
var saveTimeout = null;

function getSavedProgress() {
  try {
    var data = localStorage.getItem(savedProgressKey);
    return data ? JSON.parse(data) : null;
  } catch(e) { return null; }
}

function saveProgress(currentTime, totalDuration) {
  try {
    var data = {
      currentTime: currentTime,
      totalDuration: totalDuration,
      timestamp: Date.now()
    };
    localStorage.setItem(savedProgressKey, JSON.stringify(data));
  } catch(e) {}
}

function markCompleted(totalDuration, currentTime) {
  try {
    localStorage.setItem(savedProgressKey + '_completed', '1');
  } catch(e) {}
}

function isCompleted() {
  try {
    return localStorage.getItem(savedProgressKey + '_completed') === '1';
  } catch(e) { return false; }
}

function showResumeUI(savedData, youtubeId) {
  if (savedData && savedData.currentTime > 0) {
    if (isCompleted()) {
      // Video ya terminado: mostrar overlay con "Ver de nuevo" y pausar
      completeBadge.style.display = 'inline-block';
      resumeBtn.style.display = 'flex';
      resumeBtn.innerHTML = '<span class="material-symbols-outlined text-[24px]">replay</span> Ver de nuevo';
      resumeBtn.onclick = function() {
        resumeOverlay.style.display = 'none';
        try { localStorage.removeItem(savedProgressKey + '_completed'); } catch(e) {}
        if (player && typeof player.seekTo === 'function') {
          player.seekTo(0, true);
          player.playVideo();
        } else if (player && typeof player.playVideo === 'function') {
          player.playVideo();
        }
      };
      if (player && typeof player.pauseVideo === 'function') player.pauseVideo();
      resumeOverlay.style.display = 'flex';
    } else {
      // Mantener progreso/posición y reproducir automáticamente sin requerir clic
      completeBadge.style.display = 'none';
      resumeBtn.style.display = 'none';
      resumeOverlay.style.display = 'none';
    }
  } else {
    resumeOverlay.style.display = 'none';
    if (player && typeof player.playVideo === 'function') {
      player.playVideo();
    }
  }
}

function hideResumeUI() {
  resumeOverlay.style.display = 'none';
}

window.onYouTubeIframeAPIReady = function() {};

if (playerSection && youtubeId) {
  playerSection.style.position = 'relative';
  playerContainer.style.width = '100%';
  playerContainer.style.height = '100%';

  var savedData = getSavedProgress();
  var totalSeconds = 0;
  var timeParts = lesson.duration.split(':');
  totalSeconds = parseInt(timeParts[0]) * 60 + parseInt(timeParts[1]);

  var savedPct = 0;
  if (savedData && savedData.currentTime > 0 && !isCompleted()) {
    savedPct = Math.min(100, (savedData.currentTime / totalSeconds) * 100);
  } else if (!isNaN(progressOverride)) {
    savedPct = Math.min(100, Math.max(0, progressOverride));
  } else {
    savedPct = lesson.progress || 0;
  }

  var progressBarEl = document.getElementById('progress-bar');
  if (progressBarEl) progressBarEl.style.width = savedPct + '%';

  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player(playerContainer, {
      videoId: youtubeId,
      playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: function(event) {
          if (savedData && savedData.currentTime > 0 && !isCompleted()) {
            // Reproducir automáticamente el video seleccionado en la posición guardada
            try { event.target.seekTo(savedData.currentTime, true); } catch(e) {}
            event.target.playVideo();
            hideResumeUI();
            // Sincronizar barra y tiempo al retomar
            try {
              var pctResume = totalSeconds > 0 ? Math.min(100, (savedData.currentTime / totalSeconds)*100) : 0;
              if (progressBarEl) progressBarEl.style.width = pctResume + '%';
              var mc = Math.floor(savedData.currentTime / 60);
              var sc = Math.floor(savedData.currentTime % 60);
              var tEl = document.getElementById('time-current');
              if (tEl) tEl.textContent = mc + ':' + (sc < 10 ? '0' : '') + sc;
            } catch(e2) {}
          } else if (savedData && isCompleted()) {
            showResumeUI(savedData, youtubeId);
          } else {
            // Sin progreso previo: ocultar overlay e intentar reproducir automáticamente.
            showResumeUI(null);
          }
        },
        onStateChange: function(event) {
          if (event.data === YT.PlayerState.PLAYING) {
            hideResumeUI();
            if (typeof btnPlayPause !== 'undefined' && btnPlayPause) btnPlayPause.textContent = 'pause';
          }
          if (event.data === YT.PlayerState.PAUSE || event.data === YT.PlayerState.ENDED) {
            if (typeof btnPlayPause !== 'undefined' && btnPlayPause) btnPlayPause.textContent = 'play_arrow';
            var currentTime = player.getCurrentTime();
            var duration = player.getDuration();
            saveProgress(currentTime, duration);
            var pct = (currentTime / duration) * 100;
            if (progressBarEl) progressBarEl.style.width = pct + '%';
            if (currentTime >= duration * 0.9 && duration > 0) {
              markCompleted(duration, currentTime);
              completeBadge.style.display = 'inline-block';
              resumeBtn.style.display = 'none';
            }
          }
          if (event.data === YT.PlayerState.ENDED) {
            if (progressBarEl) progressBarEl.style.width = '100%';
            markCompleted(totalSeconds, totalSeconds);
            completeBadge.style.display = 'inline-block';
            resumeBtn.style.display = 'none';
          }
        }
      }
    });

    setInterval(function() {
      if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        var currentTime = player.getCurrentTime();
        var duration = player.getDuration();
        if (duration > 0) {
          saveProgress(currentTime, duration);
          var mins = Math.floor(currentTime / 60);
          var secs = Math.floor(currentTime % 60);
          var timeCurrentEl = document.getElementById('time-current');
          if (timeCurrentEl) timeCurrentEl.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
          var pct = (currentTime / duration) * 100;
          if (progressBarEl) progressBarEl.style.width = pct + '%';
          if (currentTime >= duration * 0.9) {
            markCompleted(duration, currentTime);
            completeBadge.style.display = 'inline-block';
            resumeBtn.style.display = 'none';
          }
          if (saveTimeout) clearTimeout(saveTimeout);
          saveTimeout = setTimeout(function() {
            progressSaveIndicator.classList.add('show');
            setTimeout(function() { progressSaveIndicator.classList.remove('show'); }, 1000);
          }, 500);
        }
      }
    }, 3000);
  };

  window.addEventListener('beforeunload', function() {
    if (player && typeof player.getCurrentTime === 'function') {
      saveProgress(player.getCurrentTime(), player.getDuration());
    }
  });
  // Móviles y cambios de pestaña: beforeunload no siempre dispara.
  function saveNow() {
    try {
      if (player && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
        saveProgress(player.getCurrentTime(), player.getDuration());
      }
    } catch(e) {}
  }
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) saveNow();
  });

  // Controles propios del reproductor (estaban sin acción).
  var btnPlayPause = document.getElementById('btn-playpause');
  if (btnPlayPause) {
    btnPlayPause.addEventListener('click', function() {
      if (!player || typeof player.getPlayerState !== 'function') return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        btnPlayPause.textContent = 'play_arrow';
      } else {
        hideResumeUI();
        player.playVideo();
        btnPlayPause.textContent = 'pause';
      }
    });
  }
  function seekBy(seconds) {
    if (!player || typeof player.getCurrentTime !== 'function' || typeof player.seekTo !== 'function') return;
    var t = player.getCurrentTime() + seconds;
    if (t < 0) t = 0;
    try {
      var d = player.getDuration();
      if (d > 0 && t > d) t = d;
    } catch(e) {}
    player.seekTo(t, true);
  }
  var btnReplay = document.getElementById('btn-replay');
  if (btnReplay) btnReplay.addEventListener('click', function() { hideResumeUI(); seekBy(-10); });
  var btnForward = document.getElementById('btn-forward');
  if (btnForward) btnForward.addEventListener('click', function() { hideResumeUI(); seekBy(10); });
}

  // --- Render ---
  document.title = lesson.title + ' - Mundo Braille';

  document.getElementById('lesson-title').textContent = lesson.title;
  document.getElementById('lesson-meta').innerHTML = 'Curso: <span id="course-name">' + course.name + '</span> • Prof. ' + course.instructor;
  // Background
  var bgEl = document.getElementById('video-background');
  if (bgEl && lesson.background) {
    bgEl.style.backgroundImage = 'url(' + lesson.background + ')';
  }

  // Duration & progress — respeta progreso/posición guardada por video
  var timeTotalEl = document.getElementById('time-total');
  if (timeTotalEl) timeTotalEl.textContent = lesson.duration;
  var savedForBar = getSavedProgress();
  var pct;
  if (savedForBar && savedForBar.currentTime > 0 && !isCompleted()) {
    var totBar = 0; try { var tpBar = lesson.duration.split(':'); totBar = parseInt(tpBar[0])*60 + parseInt(tpBar[1]); } catch(e) {}
    pct = totBar > 0 ? Math.min(100, (savedForBar.currentTime / totBar)*100) : (lesson.progress || 0);
  } else if (!isNaN(progressOverride)) {
    pct = Math.min(100, Math.max(0, progressOverride));
  } else {
    pct = lesson.progress || 0;
  }
  var progressBarEl2 = document.getElementById('progress-bar');
  if (progressBarEl2) progressBarEl2.style.width = pct + '%';
  // Mantener sincronizada la barra interna usada por el player (si existe)
  try { if (typeof progressBarEl !== 'undefined' && progressBarEl && progressBarEl2 !== progressBarEl) progressBarEl.style.width = pct + '%'; } catch(e) {}

  // Related lessons
  var relatedBox = document.getElementById('related-lessons');
  relatedBox.innerHTML = '';
  course.related.forEach(function(r) {
    var div = document.createElement('div');
    div.className = 'group flex gap-4 p-3 rounded-2xl bg-surface hover:bg-surface-container transition-all cursor-pointer border border-transparent hover:border-outline-variant shadow-sm';
    div.innerHTML =
      '<div class="relative w-32 h-20 flex-shrink-0 rounded-lg overflow-hidden bg-tertiary">' +
        '<div class="w-full h-full bg-cover bg-center" style="background-image: url(' + r.background + ')"></div>' +
        '<span class="absolute bottom-1 right-1 bg-primary/80 text-white text-[10px] px-1 rounded">' + r.duration + '</span>' +
      '</div>' +
      '<div class="flex flex-col justify-center">' +
        '<h4 class="text-body-md font-bold text-on-surface line-clamp-2 group-hover:text-secondary transition-colors">' + r.title + '</h4>' +
        '<p class="text-label-sm text-on-surface-variant">' + r.level + ' • ' + r.module + '</p>' +
      '</div>';
    div.addEventListener('click', function() {
      window.location.href = 'reproductor_leccion.html?course=' + encodeURIComponent(r.course) + '&lesson=' + encodeURIComponent(r.lesson);
    });
    relatedBox.appendChild(div);
  });

  // "Ver todo el curso" button
  document.getElementById('view-course-btn').addEventListener('click', function() {
    window.location.href = 'ejercicios_interactivos.html?course=' + encodeURIComponent(courseSlug);
  });

  // --- Micro-interactions ---
  document.querySelectorAll('button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      this.classList.add('scale-95');
      setTimeout(function() { btn.classList.remove('scale-95'); }, 150);
    });
  });
})();
</script>
</body></html>
