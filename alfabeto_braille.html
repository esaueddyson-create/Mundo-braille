<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Alfabeto Braille - Mundo Braille</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="assets/css/shared.css"/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="assets/js/tailwind-config.js"></script>
  <style>
    body {
      min-height: 100dvh;
      min-height: 100svh;
    }
    @media (max-width: 600px) {
      body { min-height: 100dvh; }
    }
    @keyframes braille-pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .braille-pop {
      animation: braille-pop 0.3s ease;
    }
    .tactile-card { cursor: pointer; }
    @keyframes braille-popup-in {
      0%   { opacity: 0; transform: scale(0.6); }
      60%  { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes braille-popup-out {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.6); }
    }
    #braille-popup {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #braille-popup .popup-card {
      background: var(--surface, #fff);
      border-radius: 28px;
      padding: 32px;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      border: 3px solid #c4c6cf;
    }
    #braille-popup .popup-image { font-size: 42vw; line-height: 1; }
    #braille-popup .popup-letter { font-size: 18vw; font-weight: 800; color: var(--primary, #000); line-height: 1; }
    #braille-popup .popup-word { font-size: 6vw; color: var(--on-surface-variant, #555); }
    #braille-popup .popup-braille { width: 60vw; max-width: 320px; }
    @media (min-width: 768px) {
      #braille-popup .popup-image { font-size: 320px; }
      #braille-popup .popup-letter { font-size: 140px; }
      #braille-popup .popup-word { font-size: 40px; }
    }
    #braille-popup.show { visibility: visible; pointer-events: auto; animation: braille-popup-in 0.25s ease; }
    #braille-popup.hide { visibility: visible; pointer-events: none; animation: braille-popup-out 0.2s ease forwards; }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface border-b border-outline-variant shadow-sm h-16 flex items-center gap-2 px-container-margin">
<a href="index.html" class="flex-shrink-0 flex items-center justify-center w-10 h-10 hover:bg-surface-container-high transition-colors rounded-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-primary text-[24px] leading-none">arrow_back</span>
</a>
<h1 class="text-title-md font-title-md font-extrabold text-primary">Alfabeto Braille</h1>
</header>
<main class="flex-grow pt-20 pb-28 px-container-margin max-w-4xl mx-auto relative">
<div class="fixed inset-0 braille-pattern-bg pointer-events-none z-0"></div>
<section class="relative z-10 space-y-stack-md">
<div class="bg-surface-container-lowest rounded-2xl p-5 custom-shadow border border-outline-variant/30 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container flex-shrink-0">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">abc</span>
</div>
<div>
<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-primary">Alfabeto Braille</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Aprende cada letra del alfabeto con su representaci\u00f3n en puntos Braille.</p>
</div>
</div>
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3" id="cards-container"></div>
</section>
</main>
<script src="assets/js/app.js"></script>
<script>
(function() {
  // FUENTE ÚNICA: reutiliza window.BrailleAlphabet definido en app.js
  // Solo datos visuales (word/image) se mantienen aquí
  var wordMap = {
    'A':{word:'Avión',image:'✈️'}, 'B':{word:'Bola',image:'⚽'}, 'C':{word:'Conejo',image:'🐰'},
    'D':{word:'Delfín',image:'🐬'}, 'E':{word:'Elefante',image:'🐘'}, 'F':{word:'Fresa',image:'🍓'},
    'G':{word:'Guitarra',image:'🎸'}, 'H':{word:'Huevo',image:'🥚'}, 'I':{word:'Isla',image:'🏝️'},
    'J':{word:'Jirafa',image:'🦒'}, 'K':{word:'Kiwi',image:'🥝'}, 'L':{word:'León',image:'🦁'},
    'M':{word:'Melón',image:'🍈'}, 'N':{word:'Nube',image:'☁️'}, 'Ñ':{word:'Ñu',image:'🦬'},
    'O':{word:'Oso',image:'🐻'}, 'P':{word:'Pizza',image:'🍕'}, 'Q':{word:'Queso',image:'🧀'},
    'R':{word:'Rosa',image:'🌹'}, 'S':{word:'Sol',image:'☀️'}, 'T':{word:'Tortuga',image:'🐢'},
    'U':{word:'Uva',image:'🍇'}, 'V':{word:'Vaca',image:'🐄'}, 'W':{word:'Waffle',image:'🧇'},
    'X':{word:'Xilófono',image:'🎼'}, 'Y':{word:'Yoyo',image:'🪀'}, 'Z':{word:'Zorro',image:'🦊'}
  };
  // celda Braille: [dot1, dot2, dot3, dot4, dot5, dot6] — viene de BrailleAlphabet
  var data = window.BrailleAlphabet.map(function(e){
    var meta = wordMap[e.letter] || {word:e.letter, image:'🔤'};
    return { letter: e.letter, word: meta.word, image: meta.image, dots: e.dots };
  });

  var isDark = document.documentElement.classList.contains('dark');
  var activeFill = isDark ? '#afc8f0' : '#000613';
  var inactiveFill = isDark ? '#3a3a3a' : '#e5e2e1';
  var inactiveStroke = isDark ? '#44474e' : '#c4c6cf';

  var borderColors = ['border-secondary-container', 'border-primary', 'border-on-primary-container'];
  var container = document.getElementById('cards-container');
  data.forEach(function(item, i) {
    var svg = '<svg viewBox="0 0 50 70" class="w-full h-16" xmlns="http://www.w3.org/2000/svg">';
    var pos = [[12,14],[12,30],[12,46],[38,14],[38,30],[38,46]];
    for (var d = 0; d < 6; d++) {
      var fill = item.dots[d] ? activeFill : inactiveFill;
      var stroke = item.dots[d] ? activeFill : inactiveStroke;
      svg += '<circle cx="' + pos[d][0] + '" cy="' + pos[d][1] + '" r="6" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>';
    }
    svg += '</svg>';

    var card = document.createElement('div');
    card.className = 'bg-white rounded-2xl p-4 tactile-card flex flex-col items-center gap-2 text-center border-l-4 ' + borderColors[i % 3];
    card.innerHTML =
      '<div class="w-11 h-11 rounded-full bg-secondary-container/20 flex items-center justify-center text-primary shadow-sm flex-shrink-0"><span class="text-title-md font-bold">' + item.letter + '</span></div>' +
      '<div class="text-[44px] leading-none" role="img" aria-label="' + item.word + '">' + item.image + '</div>' +
      '<div class="bg-surface-container-low rounded-xl py-2 px-3 w-full flex items-center justify-center">' + svg + '</div>' +
      '<p class="text-label-sm font-label-sm text-on-surface-variant">' + item.word + '</p>';
    card.addEventListener('click', function() {
      card.classList.remove('braille-pop');
      void card.offsetWidth;
      card.classList.add('braille-pop');
      showPopup(card, item);
    });
    container.appendChild(card);
  });

  var popup = document.getElementById('braille-popup');
  var popupTimer = null;
  function showPopup(card, item) {
    var isDark = document.documentElement.classList.contains('dark');
    var activeFill = isDark ? '#afc8f0' : '#000613';
    var inactiveFill = isDark ? '#3a3a3a' : '#e5e2e1';
    var inactiveStroke = isDark ? '#44474e' : '#c4c6cf';
    var pos = [[12,14],[12,30],[12,46],[38,14],[38,30],[38,46]];
    var svg = '<svg viewBox="0 0 50 70" class="popup-braille" xmlns="http://www.w3.org/2000/svg">';
    for (var d = 0; d < 6; d++) {
      var fill = item.dots[d] ? activeFill : inactiveFill;
      var stroke = item.dots[d] ? activeFill : inactiveStroke;
      svg += '<circle cx="' + pos[d][0] + '" cy="' + pos[d][1] + '" r="6" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>';
    }
    svg += '</svg>';
    popup.innerHTML =
      '<div class="popup-card">' +
        '<div class="popup-image" role="img" aria-label="' + item.word + '">' + item.image + '</div>' +
        '<div class="popup-letter">' + item.letter + '</div>' +
        svg +
        '<div class="popup-word">' + item.word + '</div>' +
      '</div>';
    popup.classList.remove('hide');
    popup.classList.add('show');
    clearTimeout(popupTimer);
  }
  function hidePopup() {
    popup.classList.remove('show');
    popup.classList.add('hide');
  }
  popup.addEventListener('click', hidePopup);
  popup.addEventListener('animationend', function() {
    if (popup.classList.contains('hide')) {
      popup.classList.remove('hide');
    }
  });
})();
</script>
<div id="braille-popup"></div>
</body></html>
