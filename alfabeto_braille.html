<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Alfabeto Braille - Mundo Braille</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="assets/css/shared.css"/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="assets/js/tailwind-config.js"></script>
<style>
    body { min-height: max(884px, 100dvh); }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface border-b border-outline-variant shadow-sm h-16 flex items-center gap-2 px-container-margin">
<a href="ejercicios_interactivos.html" class="p-2 hover:bg-surface-container-high transition-colors rounded-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</a>
<h1 class="text-title-md font-title-md font-extrabold text-primary">Alfabeto Braille</h1>
</header>
<main class="flex-grow pt-20 pb-28 px-container-margin max-w-4xl mx-auto relative">
<div class="fixed inset-0 braille-pattern-bg pointer-events-none z-0"></div>
<section class="relative z-10 space-y-stack-md">
<div class="bg-surface-container-lowest rounded-2xl p-5 custom-shadow border border-outline-variant/30 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container flex-shrink-0">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">abc</span>
</div>
<div>
<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-primary">Alfabeto Braille</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Aprende cada letra del alfabeto con su representaci\u00f3n en puntos Braille.</p>
</div>
</div>
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3" id="cards-container"></div>
</section>
</main>
<script src="assets/js/app.js"></script>
<script>
(function() {
  // celda Braille: [dot1, dot2, dot3, dot4, dot5, dot6]
  var data = [
    {letter:'A', dots:[1,0,0,0,0,0]},
    {letter:'B', dots:[1,1,0,0,0,0]},
    {letter:'C', dots:[1,0,0,1,0,0]},
    {letter:'D', dots:[1,0,0,1,1,0]},
    {letter:'E', dots:[1,0,0,0,1,0]},
    {letter:'F', dots:[1,1,0,1,0,0]},
    {letter:'G', dots:[1,1,0,1,1,0]},
    {letter:'H', dots:[1,1,0,0,1,0]},
    {letter:'I', dots:[0,1,0,1,0,0]},
    {letter:'J', dots:[0,1,0,1,1,0]},
    {letter:'K', dots:[1,0,1,0,0,0]},
    {letter:'L', dots:[1,1,1,0,0,0]},
    {letter:'M', dots:[1,0,1,1,0,0]},
    {letter:'N', dots:[1,0,1,1,1,0]},
    {letter:'\u00d1', dots:[1,1,1,1,1,1]},
    {letter:'O', dots:[1,0,1,0,1,0]},
    {letter:'P', dots:[1,1,1,1,0,0]},
    {letter:'Q', dots:[1,1,1,1,1,0]},
    {letter:'R', dots:[1,1,1,0,1,0]},
    {letter:'S', dots:[0,1,1,1,0,0]},
    {letter:'T', dots:[0,1,1,1,1,0]},
    {letter:'U', dots:[1,0,1,0,0,1]},
    {letter:'V', dots:[1,1,1,0,0,1]},
    {letter:'W', dots:[0,1,0,1,1,1]},
    {letter:'X', dots:[1,0,1,1,0,1]},
    {letter:'Y', dots:[1,0,1,1,1,1]},
    {letter:'Z', dots:[1,0,1,0,1,1]}
  ];
  var borderColors = ['border-secondary-container','border-primary','border-on-primary-container'];
  var container = document.getElementById('cards-container');
  data.forEach(function(item, i) {
    var svg = '<svg viewBox="0 0 50 70" class="w-full h-16" xmlns="http://www.w3.org/2000/svg">';
    var pos = [[12,14],[12,30],[12,46],[38,14],[38,30],[38,46]];
    for (var d = 0; d < 6; d++) {
      var fill = item.dots[d] ? '#000613' : '#e5e2e1';
      var stroke = item.dots[d] ? '#000613' : '#c4c6cf';
      svg += '<circle cx="' + pos[d][0] + '" cy="' + pos[d][1] + '" r="6" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>';
    }
    svg += '</svg>';
    var card = document.createElement('div');
    card.className = 'bg-white rounded-xl p-4 tactile-card flex flex-col items-center gap-2 text-center border-l-4 ' + borderColors[i % 3];
    card.innerHTML =
      '<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary shadow-sm flex-shrink-0"><span class="text-title-md font-bold">' + item.letter + '</span></div>' +
      '<div class="bg-surface-container-low rounded-xl py-2 px-3 w-full flex items-center justify-center">' + svg + '</div>' +
      '<p class="text-label-sm font-label-sm text-on-surface-variant">Letra <span class="font-bold text-on-surface">' + item.letter + '</span></p>';
    container.appendChild(card);
  });
})();
</script>
</body></html>
